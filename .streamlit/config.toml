[server]
headless = true
runOnSave = false
maxUploadSize = 5
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E3E8F0"
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#0B1F3A"
secondaryBackgroundColor = "#132B4F"
textColor = "#E2E8F0"
primaryColor = "#60A5FA"
borderColor = "#1E3A5F"
